[project]
name = "selene-core"
version = "0.0.0"
description = "SELENE-XR scientific core: ingestion, geometry, matching, adjustment, products, and verdicts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "../../LICENSE" }
dependencies = [
    # Kept deliberately small. Every addition must respect ADR-005: no HTTP,
    # ORM, queue, cache, object-store, or UI dependency may enter this package.
    "numpy>=1.26",
    "pydantic>=2.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3", "shapely>=2.0", "pyproj>=3.6"]
geometry = ["spiceypy>=6.0", "pvl>=1.3"]
learned = ["joblib>=1.4", "scikit-learn>=1.5", "torch>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selene_core"]
