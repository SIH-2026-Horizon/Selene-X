[project]
name = "selene-worker"
version = "0.0.0"
description = "SELENE-XR optional long-stage worker adapters (post-MVP entry criteria apply)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "../../LICENSE" }
dependencies = [
    "selene-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selene_worker"]
