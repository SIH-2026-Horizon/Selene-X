[project]
name = "selene-client"
version = "0.0.0"
description = "SELENE-XR command line interface and REST API client"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "../../LICENSE" }
dependencies = [
    "selene-core",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
selene = "selene_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selene_client"]
