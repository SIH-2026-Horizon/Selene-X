[project]
name = "selene-training"
version = "0.1.0"
description = "Training pipelines for SELENE-XR model artifacts"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=2.20",
    "joblib>=1.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "selene-core",
    "torch>=2.3",
]

[project.scripts]
selene-train = "selene_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selene_train"]
